<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Elegant Cream Clock</title>

  <style>
    :root {
      --cream: #f3eadc;
      --ivory: #fffaf2;
      --ink: #443a32;
      --taupe: #aa9783;
      --gold: #b98258;
      --line: #ddcdb9;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
      padding: clamp(4px, 2vw, 12px);
      font-family: Arial, sans-serif;
    }

    .widget {
      container-type: inline-size;
      width: min(100%, 320px);
      padding: clamp(10px, 4cqw, 14px);
      overflow: hidden;

      background:
        radial-gradient(
          circle at 22% 12%,
          rgba(255, 255, 255, 0.78),
          transparent 32%
        ),
        linear-gradient(
          145deg,
          #f8f1e6 0%,
          var(--cream) 100%
        );

      border: 1px solid rgba(192, 164, 134, 0.45);
      border-radius: clamp(16px, 7cqw, 22px);

      box-shadow:
        0 14px 30px rgba(78, 59, 43, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .clock {
      container-type: inline-size;
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 45% 35%,
          #fffdf8 0%,
          var(--ivory) 54%,
          #f7eddf 100%
        );

      border: 1px solid var(--line);
      border-radius: 50%;

      box-shadow:
        0 8px 18px rgba(78, 59, 43, 0.08),
        inset 0 0 0 clamp(3px, 2.95cqw, 6px)
          rgba(255, 255, 255, 0.38),
        inset 0 0 0 clamp(4px, 3.45cqw, 7px)
          rgba(185, 130, 88, 0.10);
    }

    .clock::before {
      content: "";
      position: absolute;
      inset: 5.4cqw;
      z-index: 0;

      border: 1px solid rgba(185, 130, 88, 0.16);
      border-radius: 50%;
    }

    .mark {
      position: absolute;
      top: 5.9cqw;
      left: 50%;
      z-index: 1;

      width: clamp(1px, 0.5cqw, 2px);
      height: 2.95cqw;

      background: var(--taupe);
      border-radius: 10px;

      transform-origin: 50% 43.6cqw;
    }

    .mark.major {
      width: clamp(1.5px, 1cqw, 3px);
      height: 4.9cqw;
      background: var(--ink);
    }

    .numeral {
      position: absolute;
      z-index: 1;

      color: var(--ink);

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(10px, 6.4cqw, 13px);
      line-height: 1;

      transform: translate(-50%, -50%);
    }

    .n12 {
      top: 13.2cqw;
      left: 50%;
    }

    .n3 {
      top: 50%;
      right: 9.8cqw;
      transform: translate(0, -50%);
    }

    .n6 {
      bottom: 9.3cqw;
      left: 50%;
      transform: translate(-50%, 0);
    }

    .n9 {
      top: 50%;
      left: 11.3cqw;
      transform: translate(0, -50%);
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      z-index: 3;

      border-radius: 999px;
      transform-origin: 50% 100%;
      will-change: transform;
    }

    .hour {
      width: clamp(3px, 2.95cqw, 6px);
      height: 22.5cqw;
      margin-left: calc(clamp(3px, 2.95cqw, 6px) / -2);

      background: var(--ink);

      box-shadow:
        0 1px 2px rgba(68, 58, 50, 0.16);
    }

    .minute {
      width: clamp(2px, 1.95cqw, 4px);
      height: 31.9cqw;
      margin-left: calc(clamp(2px, 1.95cqw, 4px) / -2);

      background: var(--ink);

      box-shadow:
        0 1px 2px rgba(68, 58, 50, 0.14);
    }

    .second {
      width: clamp(1px, 0.74cqw, 1.5px);
      height: 34.8cqw;
      margin-left: calc(clamp(1px, 0.74cqw, 1.5px) / -2);

      background: var(--gold);
    }

    .second::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;

      width: clamp(1px, 0.74cqw, 1.5px);
      height: 8.3cqw;

      background: var(--gold);
      transform: translateX(-50%);
    }

    .pin {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 4;

      width: clamp(8px, 5.9cqw, 12px);
      height: clamp(8px, 5.9cqw, 12px);

      margin: calc(clamp(8px, 5.9cqw, 12px) / -2);

      background: var(--gold);
      border: clamp(2px, 1.45cqw, 3px) solid var(--ivory);
      border-radius: 50%;

      box-shadow:
        0 0 0 1px var(--gold);
    }

    .date {
      margin: clamp(8px, 3.5cqw, 11px) 4px 1px;

      color: #8e7b69;

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(10px, 3.75cqw, 12px);
      font-style: italic;
      letter-spacing: 0.01em;
      line-height: 1.25;

      text-align: center;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>
  <main class="widget" aria-label="Current local time">
    <div class="clock" id="clock" aria-hidden="true">
      <span class="numeral n12">12</span>
      <span class="numeral n3">3</span>
      <span class="numeral n6">6</span>
      <span class="numeral n9">9</span>

      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>

      <div class="pin"></div>
    </div>

    <div
      class="date"
      id="date"
      aria-live="polite"
    ></div>
  </main>

  <script>
    const clock = document.getElementById("clock");
    const hourHand = document.getElementById("hour");
    const minuteHand = document.getElementById("minute");
    const secondHand = document.getElementById("second");
    const dateLabel = document.getElementById("date");

    // Create the clock marks.
    for (let index = 0; index < 60; index += 1) {
      // Keep the positions of 12, 3, 6 and 9 clear.
      if (index % 15 === 0) {
        continue;
      }

      const mark = document.createElement("span");

      mark.className =
        index % 5 === 0
          ? "mark major"
          : "mark";

      mark.style.transform =
        `translateX(-50%) rotate(${index * 6}deg)`;

      clock.prepend(mark);
    }

    // Use the language of the person viewing the clock.
    const dateFormatter =
      new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        day: "numeric",
        month: "long"
      });

    let displayedDate = "";

    function updateClock() {
      // The viewer's local timezone is used automatically.
      const now = new Date();

      const milliseconds =
        now.getMilliseconds();

      const seconds =
        now.getSeconds() +
        milliseconds / 1000;

      const minutes =
        now.getMinutes() +
        seconds / 60;

      const hours =
        (now.getHours() % 12) +
        minutes / 60;

      hourHand.style.transform =
        `rotate(${hours * 30}deg)`;

      minuteHand.style.transform =
        `rotate(${minutes * 6}deg)`;

      secondHand.style.transform =
        `rotate(${seconds * 6}deg)`;

      const currentDate =
        dateFormatter.format(now);

      if (currentDate !== displayedDate) {
        dateLabel.textContent = currentDate;
        displayedDate = currentDate;
      }

      requestAnimationFrame(updateClock);
    }

    updateClock();
  </script>
</body>
</html>

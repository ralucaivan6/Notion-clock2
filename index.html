<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cream Analog Clock</title>

  <style>
    :root {
      --canvas: #f6f0e5;
      --face: #fffaf0;
      --ink: #514539;
      --muted: #b5a28e;
      --accent: #bc855d;
      --border: #e5d7c5;
      --shadow: rgba(82, 64, 47, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    body {
      display: grid;
      place-items: center;
      padding: 6px;
    }

    .card {
      width: min(100%, 226px);
      padding: 12px;
      display: grid;
      place-items: center;
      background:
        radial-gradient(
          circle at 25% 18%,
          rgba(255, 255, 255, 0.55),
          transparent 35%
        ),
        var(--canvas);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 8px 22px var(--shadow);
    }

    .clock {
      position: relative;
      width: min(100%, 194px);
      aspect-ratio: 1;
      background:
        radial-gradient(
          circle at 50% 42%,
          rgba(255, 255, 255, 0.8),
          transparent 54%
        ),
        var(--face);
      border: 1px solid var(--border);
      border-radius: 50%;
      box-shadow:
        inset 0 0 0 6px rgba(229, 215, 197, 0.22),
        0 3px 8px rgba(82, 64, 47, 0.06);
    }

    .clock::after {
      content: "";
      position: absolute;
      inset: 8px;
      border: 1px solid rgba(188, 133, 93, 0.16);
      border-radius: 50%;
      pointer-events: none;
    }

    .mark {
      position: absolute;
      top: 7px;
      left: 50%;
      width: 2px;
      height: 7px;
      background: var(--muted);
      border-radius: 999px;
      transform-origin: 50% 90px;
    }

    .mark.major {
      width: 3px;
      height: 11px;
      background: var(--ink);
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      z-index: 2;
      border-radius: 999px;
      transform-origin: 50% 100%;
      will-change: transform;
    }

    .hour {
      width: 6px;
      height: 46px;
      margin-left: -3px;
      background: var(--ink);
    }

    .minute {
      width: 4px;
      height: 65px;
      margin-left: -2px;
      background: var(--ink);
    }

    .second {
      width: 2px;
      height: 72px;
      margin-left: -1px;
      background: var(--accent);
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 3;
      width: 11px;
      height: 11px;
      margin: -5.5px;
      background: var(--accent);
      border: 3px solid var(--face);
      border-radius: 50%;
      box-shadow: 0 0 0 1px var(--accent);
    }

    .date {
      margin-top: 9px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.02em;
      line-height: 1.2;
      text-align: center;
    }

    @media (prefers-reduced-motion: reduce) {
      .hand {
        transition: none;
      }
    }
  </style>
</head>

<body>
  <main class="card" aria-label="Current local time">
    <div class="clock" id="clock" aria-hidden="true">
      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>
      <div class="center"></div>
    </div>

    <div class="date" id="date" aria-live="polite"></div>
  </main>

  <script>
    const clock = document.getElementById("clock");
    const hourHand = document.getElementById("hour");
    const minuteHand = document.getElementById("minute");
    const secondHand = document.getElementById("second");
    const dateLabel = document.getElementById("date");

    // Create the clock markers.
    for (let number = 0; number < 60; number += 1) {
      const mark = document.createElement("span");

      mark.className =
        number % 5 === 0 ? "mark major" : "mark";

      mark.style.transform =
        `translateX(-50%) rotate(${number * 6}deg)`;

      clock.prepend(mark);
    }

    // Uses the visitor's language automatically.
    const dateFormatter = new Intl.DateTimeFormat(undefined, {
      weekday: "long",
      day: "numeric",
      month: "long"
    });

    function updateClock() {
      // Uses the visitor's device time zone automatically.
      const now = new Date();

      const hours = now.getHours() % 12;
      const minutes = now.getMinutes();
      const seconds = now.getSeconds();
      const milliseconds = now.getMilliseconds();

      hourHand.style.transform =
        `rotate(${hours * 30 + minutes * 0.5}deg)`;

      minuteHand.style.transform =
        `rotate(${minutes * 6 + seconds * 0.1}deg)`;

      secondHand.style.transform =
        `rotate(${seconds * 6 + milliseconds * 0.006}deg)`;

      dateLabel.textContent = dateFormatter.format(now);

      // Synchronizes updates to the beginning of each second.
      window.setTimeout(updateClock, 1000 - milliseconds);
    }

    updateClock();
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Elegant Cream Clock</title>

  <style>
    :root {
      --cream: #f3eadc;
      --ivory: #fffaf2;
      --ink: #443a32;
      --taupe: #aa9783;
      --gold: #b98258;
      --line: #ddcdb9;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: transparent;
    }

    body {
      display: grid;
      place-items: center;
      padding: 6px;
      font-family: Arial, sans-serif;
    }

    .widget {
      width: min(100%, 232px);
      padding: 14px 14px 13px;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 22% 12%,
          rgba(255, 255, 255, 0.78),
          transparent 32%
        ),
        linear-gradient(
          145deg,
          #f8f1e6 0%,
          var(--cream) 100%
        );

      border: 1px solid rgba(192, 164, 134, 0.45);
      border-radius: 22px;

      box-shadow:
        0 14px 30px rgba(78, 59, 43, 0.10),
        inset 0 1px 0 rgba(255, 255, 255, 0.75);
    }

    .clock {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 45% 35%,
          #fffdf8 0%,
          var(--ivory) 54%,
          #f7eddf 100%
        );

      border: 1px solid var(--line);
      border-radius: 50%;

      box-shadow:
        0 8px 18px rgba(78, 59, 43, 0.08),
        inset 0 0 0 6px rgba(255, 255, 255, 0.38),
        inset 0 0 0 7px rgba(185, 130, 88, 0.10);
    }

    .clock::before {
      content: "";
      position: absolute;
      inset: 11px;
      z-index: 0;
      border: 1px solid rgba(185, 130, 88, 0.16);
      border-radius: 50%;
    }

    .mark {
      position: absolute;
      top: 12px;
      left: 50%;
      z-index: 1;

      width: 1px;
      height: 6px;

      background: var(--taupe);
      border-radius: 10px;

      transform-origin: 50% 89px;
    }

    .mark.major {
      width: 2px;
      height: 10px;
      background: var(--ink);
    }

    .numeral {
      position: absolute;
      z-index: 1;

      color: var(--ink);

      font-family: Georgia, "Times New Roman", serif;
      font-size: 13px;
      line-height: 1;

      transform: translate(-50%, -50%);
    }

    .n12 {
      top: 27px;
      left: 50%;
    }

    .n3 {
      top: 50%;
      right: 20px;
      transform: translate(0, -50%);
    }

    .n6 {
      bottom: 19px;
      left: 50%;
      transform: translate(-50%, 0);
    }

    .n9 {
      top: 50%;
      left: 23px;
      transform: translate(0, -50%);
    }

    .hand {
      position: absolute;
      bottom: 50%;
      left: 50%;
      z-index: 3;

      border-radius: 999px;
      transform-origin: 50% 100%;
      will-change: transform;
    }

    .hour {
      width: 6px;
      height: 46px;
      margin-left: -3px;

      background: var(--ink);
      box-shadow: 0 1px 2px rgba(68, 58, 50, 0.16);
    }

    .minute {
      width: 4px;
      height: 65px;
      margin-left: -2px;

      background: var(--ink);
      box-shadow: 0 1px 2px rgba(68, 58, 50, 0.14);
    }

    .second {
      width: 1.5px;
      height: 71px;
      margin-left: -0.75px;

      background: var(--gold);
    }

    .second::after {
      content: "";
      position: absolute;
      top: 100%;
      left: 50%;

      width: 1.5px;
      height: 17px;

      background: var(--gold);
      transform: translateX(-50%);
    }

    .pin {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 4;

      width: 12px;
      height: 12px;
      margin: -6px;

      background: var(--gold);
      border: 3px solid var(--ivory);
      border-radius: 50%;

      box-shadow: 0 0 0 1px var(--gold);
    }

    .date {
      margin: 11px 4px 1px;

      color: #8e7b69;

      font-family: Georgia, "Times New Roman", serif;
      font-size: 12px;
      font-style: italic;
      letter-spacing: 0.01em;

      text-align: center;
    }
  </style>
</head>

<body>
  <main class="widget" aria-label="Current local time">
    <div class="clock" id="clock" aria-hidden="true">
      <span class="numeral n12">12</span>
      <span class="numeral n3">3</span>
      <span class="numeral n6">6</span>
      <span class="numeral n9">9</span>

      <div class="hand hour" id="hour"></div>
      <div class="hand minute" id="minute"></div>
      <div class="hand second" id="second"></div>

      <div class="pin"></div>
    </div>

    <div class="date" id="date" aria-live="polite"></div>
  </main>

  <script>
    const clock = document.getElementById("clock");
    const hourHand = document.getElementById("hour");
    const minuteHand = document.getElementById("minute");
    const secondHand = document.getElementById("second");
    const dateLabel = document.getElementById("date");

    // Creează marcajele de pe cadran.
    for (let index = 0; index < 60; index += 1) {
      // Nu pune marcaje peste cifrele 12, 3, 6 și 9.
      if (index % 15 === 0) {
        continue;
      }

      const mark = document.createElement("span");

      mark.className =
        index % 5 === 0 ? "mark major" : "mark";

      mark.style.transform =
        `translateX(-50%) rotate(${index * 6}deg)`;

      clock.prepend(mark);
    }

    // Data se adaptează automat la limba utilizatorului.
    const dateFormatter = new Intl.DateTimeFormat(undefined, {
      weekday: "long",
      day: "numeric",
      month: "long"
    });

    let displayedDate = "";

    function updateClock() {
      // Ora se adaptează automat la fusul orar al utilizatorului.
      const now = new Date();

      const milliseconds = now.getMilliseconds();
      const seconds =
        now.getSeconds() + milliseconds / 1000;

      const minutes =
        now.getMinutes() + seconds / 60;

      const hours =
        (now.getHours() % 12) + minutes / 60;

      hourHand.style.transform =
        `rotate(${hours * 30}deg)`;

      minuteHand.style.transform =
        `rotate(${minutes * 6}deg)`;

      secondHand.style.transform =
        `rotate(${seconds * 6}deg)`;

      const currentDate = dateFormatter.format(now);

      if (currentDate !== displayedDate) {
        dateLabel.textContent = currentDate;
        displayedDate = currentDate;
      }

      requestAnimationFrame(updateClock);
    }

    updateClock();
  </script>
</body>
</html>
